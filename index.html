<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A2540" />
  <meta name="description" content="Учёт Долгов — удобный учёт долгов с фото расписок и напоминаниями" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Учёт Долгов</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Учёт Долгов</h1>
      <div class="header-actions">
        <button id="btn-export" class="btn-header" title="Сохранить копию">💾</button>
        <button id="btn-import" class="btn-header" title="Восстановить">📂</button>
        <input type="file" id="input-import" accept="application/json,.json" hidden />
        <button id="btn-install" class="btn-install hidden" title="Установить приложение">⬇</button>
      </div>
    </header>

    <section class="balance-card">
      <div class="balance-label">Общий баланс</div>
      <div class="balance-value" id="balance-value">0.00 L</div>
      <div class="balance-row">
        <div>
          <div class="balance-sub-label">Мне ещё должны</div>
          <div class="balance-sub-value red" id="owed-to-me">0.00 L</div>
        </div>
        <div class="text-right">
          <div class="balance-sub-label">Я должен</div>
          <div class="balance-sub-value green" id="i-owe">0.00 L</div>
        </div>
      </div>
    </section>

    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="all">Все</button>
      <button class="filter-chip" data-filter="active">Активные</button>
      <button class="filter-chip" data-filter="owed">Мне ещё должны</button>
      <button class="filter-chip" data-filter="owe">Я должен</button>
    </div>

    <main class="debt-list" id="debt-list"></main>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">💳</div>
      <p id="empty-text">Нет долгов.<br>Нажмите + чтобы добавить.</p>
    </div>

    <button class="fab" id="btn-add" title="Добавить долг">+</button>
  </div>

  <!-- Client card -->
  <div class="modal-overlay hidden" id="client-modal">
    <div class="modal client-modal">
      <div class="modal-header">
        <button class="btn-back" id="btn-close-client">←</button>
        <h2 id="client-name">Клиент</h2>
        <span style="width:36px"></span>
      </div>
      <div class="modal-body" id="client-body">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <!-- Modal: Add / Edit debt or payment -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Новый долг</h2>
        <button class="btn-close" id="btn-close-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group" id="group-name">
          <label>Имя / Кому *</label>
          <input type="text" id="input-name" placeholder="Иван Иванов" maxlength="80" />
          <div class="error" id="error-name"></div>
        </div>

        <div class="form-group">
          <label>Сумма *</label>
          <div class="input-with-suffix">
            <input type="number" id="input-amount" placeholder="0" min="0.01" step="0.01" />
            <span id="amount-suffix">L</span>
          </div>
          <div class="error" id="error-amount"></div>
        </div>

        <div class="form-group">
          <label>Валюта</label>
          <div class="currency-toggle" id="currency-toggle">
            <button type="button" class="currency-btn active" data-currency="MDL">MDL (L)</button>
            <button type="button" class="currency-btn" data-currency="USD">USD ($)</button>
            <button type="button" class="currency-btn" data-currency="EUR">EUR (€)</button>
          </div>
        </div>

        <div class="form-group" id="group-type">
          <label>Тип</label>
          <div class="type-toggle">
            <button type="button" class="type-btn active" data-type="owed">Долг мне</button>
            <button type="button" class="type-btn" data-type="owe">Я должен</button>
          </div>
        </div>

        <div class="form-group" id="group-phone">
          <label>Телефон</label>
          <input type="tel" id="input-phone" placeholder="+373 68 123 456" />
        </div>

        <div class="form-group">
          <label>Комментарий</label>
          <textarea id="input-desc" rows="2" placeholder="Необязательно" maxlength="200"></textarea>
        </div>

        <div class="form-group" id="group-due">
          <label>Дата возврата</label>
          <input type="date" id="input-due" />
          <button type="button" class="btn-link" id="btn-clear-due">Убрать дату</button>
        </div>

        <div class="form-group" id="group-photo">
          <label>Фото чека / расписки</label>
          <div class="photo-area" id="photo-area">
            <input type="file" id="input-photo" accept="image/*" capture="environment" hidden />
            <button type="button" class="btn-photo" id="btn-photo">
              <span>📷</span> Прикрепить фото
            </button>
            <div class="photo-preview hidden" id="photo-preview">
              <img id="photo-img" alt="Расписка" />
              <button type="button" class="btn-remove-photo" id="btn-remove-photo">×</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel">Отмена</button>
        <button class="btn-primary" id="btn-save">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="photo-viewer hidden" id="photo-viewer">
    <button class="btn-close-viewer" id="btn-close-viewer">×</button>
    <img id="viewer-img" alt="Расписка" />
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
